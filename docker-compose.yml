services:
  backend-1:
    build: .
    command: ["node", "backends/dummy-server.js", "4001"]

  backend-2:
    build: .
    command: ["node", "backends/dummy-server.js", "4002"]

  backend-3:
    build: .
    command: ["node", "backends/dummy-server.js", "4003"]

  # Two independent load balancer instances sharing the same static
  # backend list. Demonstrates that consistent hashing needs no
  # coordination between instances to route identically — see the
  # "Horizontal Scaling" section in README.md.
  lb-1:
    build: .
    environment:
      LB_PORT: "8080"
      BACKENDS_JSON: >-
        [{"id":"backend-1","host":"backend-1","port":4001},
         {"id":"backend-2","host":"backend-2","port":4002},
         {"id":"backend-3","host":"backend-3","port":4003}]
    ports:
      - "8081:8080"
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  lb-2:
    build: .
    environment:
      LB_PORT: "8080"
      BACKENDS_JSON: >-
        [{"id":"backend-1","host":"backend-1","port":4001},
         {"id":"backend-2","host":"backend-2","port":4002},
         {"id":"backend-3","host":"backend-3","port":4003}]
    ports:
      - "8082:8080"
    depends_on:
      - backend-1
      - backend-2
      - backend-3

  # L4-ish round-robin front door across the two LB instances.
  nginx:
    image: nginx:alpine
    volumes:
      - ./docker/nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - lb-1
      - lb-2
